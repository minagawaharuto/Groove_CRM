<!-- ============================================================
     components.html — テンプレート定義
     タレント・インフルエンサー管理 CRM
     ============================================================ -->

<!-- ═══ 1. 検索ビュー ═══════════════════════════════════════ -->
<template id="tpl-search-view">
  <div class="two-column">
    <!-- 左ペイン：検索フォーム＋結果 -->
    <div class="left-pane">
      <div class="card">
        <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <h2 class="card-title" style="display:inline-block; margin-right:8px;">&#128269; 人物検索</h2>
            <span class="text-sm text-muted" id="search-result-count"></span>
          </div>
          <div>
            <button class="btn btn-sm btn-outline" id="btn-toggle-checked" style="margin-right: 8px;">✔️ 選択のみ表示</button>
            <button class="btn btn-sm btn-outline" id="btn-export-csv" style="margin-right: 8px;">📥 CSV出力</button>
            <button class="btn btn-sm btn-outline" id="btn-batch-enrich" style="margin-right: 8px; border-color: #a855f7; color: #a855f7;">✨ 一括AI補完</button>
            <button class="btn btn-sm btn-primary" id="btn-create-person">&#10133; 新規登録</button>
          </div>
        </div>
        <!-- AI検索バー -->
        <div id="ai-search-bar" style="display:flex; gap:8px; align-items:center; margin-bottom:10px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 8px; padding: 8px 12px;">
          <span style="font-size:1.1em; flex-shrink:0;">🤖</span>
          <input type="text" id="ai-search-input" class="form-control" style="flex:1; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:#fff; placeholder-color:rgba(255,255,255,0.7);" placeholder="AI検索：「フォロワー1万以上の美容系インフルエンサー」のように入力...">
          <button type="button" id="btn-ai-search" class="btn btn-sm" style="background:rgba(255,255,255,0.2); color:#fff; border:1px solid rgba(255,255,255,0.4); white-space:nowrap; flex-shrink:0;">✨ AI検索</button>
        </div>
        <form id="search-form" class="form-inline" style="flex-wrap:wrap;gap:10px;">
          <div class="form-group" style="flex:2;min-width:200px;">
            <input type="text" class="form-control" id="search-keyword"
                   placeholder="フリーワード（名前 / ユーザー名 / タグ）">
          </div>
          <div class="form-group" style="min-width:130px;">
            <select class="form-control" id="search-category">
              <option value="">区分（全て）</option>
              <option value="モデル">モデル</option>
              <option value="インフルエンサー">インフルエンサー</option>
              <option value="スポーツ選手・著名人">スポーツ選手・著名人</option>
            </select>
          </div>
          <div class="form-group" style="min-width:120px;">
            <select class="form-control" id="search-status">
              <option value="">ステータス（全て）</option>
              <option value="未着手">未着手</option>
              <option value="アプローチ中">アプローチ中</option>
              <option value="交渉中">交渉中</option>
              <option value="契約済">契約済</option>
              <option value="NG">NG</option>
            </select>
          </div>
          <div class="form-group" style="min-width:100px;">
            <select class="form-control" id="search-priority">
              <option value="">優先度（全て）</option>
              <option value="高">高</option>
              <option value="中">中</option>
              <option value="低">低</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">&#128269; 検索</button>
        </form>

        <!-- 詳細フィルターパネル -->
        <div class="advanced-filter-panel" style="margin-top:12px; padding:12px 14px; background:var(--bg-secondary, #f8f9fa); border-radius:8px; border:1px solid var(--border-color, #e0e0e0);">
          <div style="font-size:0.8em; font-weight:600; color:var(--gray-500,#888); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.05em;">🔍 詳細絞り込み</div>

          <!-- フォロワー数 -->
          <div style="margin-bottom:10px;">
            <div style="font-size:0.85em; font-weight:600; margin-bottom:6px; color:var(--text-secondary,#555);">📊 フォロワー数</div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <select class="form-control" id="search-followers-min-preset" style="min-width:130px; flex:1;">
                <option value="">下限なし</option>
                <option value="1000">1,000以上</option>
                <option value="5000">5,000以上</option>
                <option value="10000">1万以上</option>
                <option value="30000">3万以上</option>
                <option value="50000">5万以上</option>
                <option value="100000">10万以上</option>
                <option value="300000">30万以上</option>
                <option value="500000">50万以上</option>
                <option value="1000000">100万以上</option>
              </select>
              <span style="color:#999; font-size:0.85em; flex-shrink:0;">〜</span>
              <select class="form-control" id="search-followers-max-preset" style="min-width:130px; flex:1;">
                <option value="">上限なし</option>
                <option value="5000">5,000以下</option>
                <option value="10000">1万以下</option>
                <option value="30000">3万以下</option>
                <option value="50000">5万以下</option>
                <option value="100000">10万以下</option>
                <option value="300000">30万以下</option>
                <option value="500000">50万以下</option>
                <option value="1000000">100万以下</option>
              </select>
              <span style="color:#bbb; font-size:0.8em; flex-shrink:0;">または手入力：</span>
              <input type="number" class="form-control" id="search-followers-min-input" placeholder="最小" min="0" style="width:90px; flex-shrink:0;">
              <span style="color:#999; font-size:0.85em; flex-shrink:0;">〜</span>
              <input type="number" class="form-control" id="search-followers-max-input" placeholder="最大" min="0" style="width:90px; flex-shrink:0;">
            </div>
          </div>

          <!-- 年齢 -->
          <div style="margin-bottom:10px;">
            <div style="font-size:0.85em; font-weight:600; margin-bottom:6px; color:var(--text-secondary,#555);">🎂 年齢</div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <select class="form-control" id="search-age-min-preset" style="min-width:110px; flex:1;">
                <option value="">下限なし</option>
                <option value="15">15歳以上</option>
                <option value="18">18歳以上</option>
                <option value="20">20歳以上</option>
                <option value="25">25歳以上</option>
                <option value="30">30歳以上</option>
                <option value="35">35歳以上</option>
                <option value="40">40歳以上</option>
              </select>
              <span style="color:#999; font-size:0.85em; flex-shrink:0;">〜</span>
              <select class="form-control" id="search-age-max-preset" style="min-width:110px; flex:1;">
                <option value="">上限なし</option>
                <option value="20">20歳以下</option>
                <option value="25">25歳以下</option>
                <option value="30">30歳以下</option>
                <option value="35">35歳以下</option>
                <option value="40">40歳以下</option>
                <option value="50">50歳以下</option>
              </select>
              <span style="color:#bbb; font-size:0.8em; flex-shrink:0;">または手入力：</span>
              <input type="number" class="form-control" id="search-age-min-input" placeholder="最小" min="0" max="120" style="width:75px; flex-shrink:0;">
              <span style="color:#999; font-size:0.85em; flex-shrink:0;">〜</span>
              <input type="number" class="form-control" id="search-age-max-input" placeholder="最大" min="0" max="120" style="width:75px; flex-shrink:0;">
            </div>
          </div>

          <!-- 居住地 / 担当窓口 / メインプラットフォーム / 事務所 -->
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <div class="form-group" style="flex:1; min-width:130px;">
              <label style="font-size:0.82em; font-weight:600; color:var(--text-secondary,#555); margin-bottom:4px; display:block;">📍 居住地</label>
              <input type="text" class="form-control" id="search-location" placeholder="例：東京、大阪">
            </div>
            <div class="form-group" style="flex:1; min-width:140px;">
              <label style="font-size:0.82em; font-weight:600; color:var(--text-secondary,#555); margin-bottom:4px; display:block;">👤 担当窓口</label>
              <select class="form-control" id="search-owner">
                <option value="">全員</option>
                <option value="山田">山田</option>
                <option value="田中">田中</option>
                <option value="鈴木">鈴木</option>
                <option value="佐藤">佐藤</option>
                <option value="伊藤">伊藤</option>
                <option value="中村">中村</option>
                <option value="加藤">加藤</option>
                <option value="木村">木村</option>
              </select>
            </div>
            <div class="form-group" style="flex:1; min-width:150px;">
              <label style="font-size:0.82em; font-weight:600; color:var(--text-secondary,#555); margin-bottom:4px; display:block;">📱 メインプラットフォーム</label>
              <select class="form-control" id="search-platform">
                <option value="">全て</option>
                <option value="Instagram">Instagram</option>
                <option value="YouTube">YouTube</option>
                <option value="TikTok">TikTok</option>
                <option value="X">X (Twitter)</option>
              </select>
            </div>
            <div class="form-group" style="flex:1; min-width:130px;">
              <label style="font-size:0.82em; font-weight:600; color:var(--text-secondary,#555); margin-bottom:4px; display:block;">🏢 事務所</label>
              <select class="form-control" id="search-agency">
                <option value="">全て</option>
                <option value="有">有（所属あり）</option>
                <option value="無">無（所属なし）</option>
              </select>
            </div>
          </div>
        </div>

        <!-- hidden inputs for followers (for compatibility with AI search) -->
        <input type="hidden" id="search-followers-min">
        <input type="hidden" id="search-followers-max">
        <!-- クイックフィルタ -->
        <div class="quick-filters" style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-sm btn-outline quick-filter-btn" data-filter="overdue">🔴 期限切れ</button>
          <button class="btn btn-sm btn-outline quick-filter-btn" data-filter="today">🟡 今日</button>
          <button class="btn btn-sm btn-outline quick-filter-btn" data-filter="week">🟢 今週</button>
        </div>
      </div>

      <!-- 結果テーブル -->
      <div class="card" style="position:relative;">
        <div id="search-loading" class="loading-overlay hidden">
          <div class="spinner"></div>
        </div>
        <table class="data-table" id="search-results-table">
          <thead>
            <tr>
              <th style="width: 40px; text-align: center;"><input type="checkbox" id="search-check-all"></th>
              <th>名前</th>
              <th>区分</th>
              <th>ユーザー名</th>
              <th>フォロワー数</th>
              <th>ステータス</th>
              <th>優先度</th>
              <th>担当</th>
              <th>次アクション日</th>
            </tr>
          </thead>
          <tbody id="search-results-body">
          </tbody>
        </table>
        <div id="search-empty" class="empty-state hidden">
          <div class="empty-state-icon">&#128373;</div>
          <div class="empty-state-text">検索結果がありません</div>
        </div>
        <div class="pagination" id="search-pagination" style="display:none;">
          <div class="pagination-info" id="pagination-info"></div>
          <div class="pagination-buttons" style="display:flex; gap:8px; align-items:center;">
            <button class="btn btn-sm btn-secondary" id="btn-prev-page">← 前へ</button>
            <span style="display:flex; align-items:center; gap:4px; margin:0 8px;">
              <input type="number" id="input-page-jump" class="form-control" style="width: 60px; padding: 2px 6px; text-align: center;" min="1" value="1">
              <span style="font-size:0.9em; color:#666;">ページへ</span>
              <button class="btn btn-sm btn-outline" id="btn-jump-page">移動</button>
            </span>
            <button class="btn btn-sm btn-secondary" id="btn-next-page">次へ →</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右ペイン：人物詳細（初期は非表示） -->
    <div class="right-pane hidden" id="person-detail-pane">
    </div>
  </div>
</template>

<!-- ═══ 2. 人物詳細パネル ═══════════════════════════════════ -->
<template id="tpl-person-detail">
  <div>
    <div class="flex-between mb-16">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img id="detail-person-avatar" src="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: none; background: #eee;">
        <h2 class="card-title" id="detail-person-name" style="margin: 0;">—</h2>
      </div>
      <div>
        <button class="btn btn-sm btn-outline" id="btn-ai-enrich" style="margin-right: 8px; border-color: #a855f7; color: #a855f7;">✨ AI情報自動補完</button>
        <button class="close-btn" id="btn-close-detail" title="閉じる">&times;</button>
      </div>
    </div>

    <!-- 基本情報 -->
    <div class="detail-section">
      <div class="detail-section-title">基本情報</div>
      <div class="detail-grid" id="detail-basic-info">
        <!-- JSで動的に描画 -->
      </div>
    </div>

    <!-- CRM情報（編集可能） -->
    <div class="detail-section">
      <div class="detail-section-title">CRM情報</div>
      <form id="person-crm-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">ステータス</label>
            <select class="form-control" id="crm-status">
              <option value="">未設定</option>
              <option value="未着手">未着手</option>
              <option value="アプローチ中">アプローチ中</option>
              <option value="交渉中">交渉中</option>
              <option value="契約済">契約済</option>
              <option value="NG">NG</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">優先度</label>
            <select class="form-control" id="crm-priority">
              <option value="">未設定</option>
              <option value="高">高</option>
              <option value="中">中</option>
              <option value="低">低</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">社内担当</label>
            <input type="text" class="form-control" id="crm-owner">
          </div>
          <div class="form-group">
            <label class="form-label">次アクション日</label>
            <input type="date" class="form-control" id="crm-next-action-date">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">次アクション内容</label>
          <input type="text" class="form-control" id="crm-next-action">
        </div>
        <div class="form-group">
          <label class="form-label">メモ</label>
          <textarea class="form-control" id="crm-memo" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">&#128190; CRM情報を保存</button>
      </form>
    </div>

    <!-- ログ追加 -->
    <div class="detail-section">
      <div class="detail-section-title">活動ログを追加</div>
      <form id="add-log-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">種別</label>
            <select class="form-control" id="log-type" required>
              <option value="">選択...</option>
              <option value="電話">電話</option>
              <option value="メール">メール</option>
              <option value="DM">DM</option>
              <option value="面談">面談</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">結果</label>
            <input type="text" class="form-control" id="log-result" placeholder="例：返信あり">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">内容</label>
          <textarea class="form-control" id="log-content" rows="2" required placeholder="活動の内容を入力..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">次アクション日</label>
            <input type="date" class="form-control" id="log-next-date">
          </div>
          <div class="form-group">
            <label class="form-label">次アクション内容</label>
            <input type="text" class="form-control" id="log-next-content">
          </div>
        </div>
        <button type="submit" class="btn btn-success btn-sm">&#10133; ログ追加</button>
      </form>
    </div>

    <!-- タイムライン -->
    <div class="detail-section">
      <div class="detail-section-title">活動タイムライン</div>
      <div id="person-timeline">
        <div class="loading-inline"><div class="spinner"></div><span>読み込み中...</span></div>
      </div>
    </div>
  </div>
</template>

<!-- ═══ 3. 案件一覧 ═════════════════════════════════════════ -->
<template id="tpl-deal-list">
  <div class="single-pane">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">&#128188; 案件一覧</h2>
        <button class="btn btn-primary" id="btn-create-deal">&#10133; 新規案件</button>
      </div>
      <form id="deal-filter-form" class="form-inline mb-16">
        <div class="form-group" style="min-width:200px;">
          <input type="text" class="form-control" id="deal-keyword" placeholder="案件名 / クライアント">
        </div>
        <div class="form-group" style="min-width:130px;">
          <select class="form-control" id="deal-status-filter">
            <option value="">状態（全て）</option>
            <option value="企画中">企画中</option>
            <option value="提案中">提案中</option>
            <option value="進行中">進行中</option>
            <option value="完了">完了</option>
            <option value="中止">中止</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">&#128269; 絞り込み</button>
      </form>
      <div style="position:relative;">
        <div id="deal-loading" class="loading-overlay hidden"><div class="spinner"></div></div>
        <table class="data-table" id="deal-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>案件名</th>
              <th>クライアント</th>
              <th>状態</th>
              <th>担当</th>
              <th>納期</th>
            </tr>
          </thead>
          <tbody id="deal-tbody"></tbody>
        </table>
        <div id="deal-empty" class="empty-state hidden">
          <div class="empty-state-icon">&#128203;</div>
          <div class="empty-state-text">案件がありません</div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ═══ 4. 案件詳細 ═════════════════════════════════════════ -->
<template id="tpl-deal-detail">
  <div class="single-pane">
    <div class="flex-between mb-16">
      <h2 class="card-title">
        <a href="#/deals" style="color:var(--gray-500);">案件一覧</a>
        <span style="color:var(--gray-400);margin:0 8px;">›</span>
        <span id="deal-detail-name">—</span>
      </h2>
    </div>

    <!-- 案件情報カード -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">案件情報</span>
        <span class="badge badge-info" id="deal-detail-status">—</span>
      </div>
      <form id="deal-edit-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">案件名</label>
            <input type="text" class="form-control" id="deal-ed-name" required>
          </div>
          <div class="form-group">
            <label class="form-label">クライアント</label>
            <input type="text" class="form-control" id="deal-ed-client">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">状態</label>
            <select class="form-control" id="deal-ed-status">
              <option value="企画中">企画中</option>
              <option value="提案中">提案中</option>
              <option value="進行中">進行中</option>
              <option value="完了">完了</option>
              <option value="中止">中止</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">担当</label>
            <input type="text" class="form-control" id="deal-ed-owner">
          </div>
          <div class="form-group">
            <label class="form-label">納期</label>
            <input type="date" class="form-control" id="deal-ed-deadline">
          </div>
        </div>
      </form>
    </div>

    <!-- 候補者テーブル -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">&#127917; キャスティング候補</span>
        <button class="btn btn-primary btn-sm" id="btn-add-person-to-deal">&#10133; 候補者追加</button>
      </div>
      <table class="data-table" id="casting-table">
        <thead>
          <tr>
            <th>person_id</th>
            <th>名前</th>
            <th>候補ステータス</th>
            <th>提示条件</th>
            <th>NG理由</th>
            <th>メモ</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="casting-tbody"></tbody>
      </table>
      <div id="casting-empty" class="empty-state hidden" style="padding:24px;">
        <div class="empty-state-text">候補者がいません。「候補者追加」から人物を追加してください。</div>
      </div>
    </div>
  </div>
</template>

<!-- ═══ 5. 管理画面 ═════════════════════════════════════════ -->
<template id="tpl-admin-view">
  <div class="single-pane">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">&#9881; 管理画面</h2>
      </div>

      <div class="admin-actions">
        <!-- Index 再構築 -->
        <div class="admin-card">
          <h3>&#128472; インデックス再構築</h3>
          <p>3つの人物シートから 90_Index を再生成します。<br>person_id 未付番の行には自動的にIDを発行します。</p>
          <button class="btn btn-primary" id="btn-rebuild-index">再構築を実行</button>
        </div>
        <!-- バリデーション -->
        <div class="admin-card">
          <h3>&#9989; データ検証</h3>
          <p>person_id 重複・URL 重複・必須項目欠落をチェックします。</p>
          <button class="btn btn-primary" id="btn-validate-data">検証を実行</button>
        </div>
        <!-- 初期セットアップ -->
        <div class="admin-card">
          <h3>&#128295; 初期セットアップ</h3>
          <p>必要シートとヘッダを自動作成します。<br>初回のみ実行してください。</p>
          <button class="btn btn-secondary" id="btn-setup-sheets">セットアップ実行</button>
        </div>
      </div>
    </div>

    <!-- バリデーション結果 -->
    <div class="card hidden" id="validation-results-card">
      <div class="card-header">
        <span class="card-title">検証結果</span>
        <span class="badge" id="validation-count-badge"></span>
      </div>
      <table class="data-table" id="validation-table">
        <thead>
          <tr><th>種別</th><th>シート</th><th>行</th><th>詳細</th></tr>
        </thead>
        <tbody id="validation-tbody"></tbody>
      </table>
    </div>

    <!-- Config 編集 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">&#128272; 権限設定（Config）</span>
      </div>
      <form id="config-form">
        <div class="form-group">
          <label class="form-label">Admin メールアドレス（カンマ区切り）</label>
          <textarea class="form-control" id="cfg-admin" rows="2" placeholder="admin1@example.com, admin2@example.com"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Editor メールアドレス（カンマ区切り）</label>
          <textarea class="form-control" id="cfg-editor" rows="2" placeholder="editor1@example.com"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Viewer メールアドレス（カンマ区切り）</label>
          <textarea class="form-control" id="cfg-viewer" rows="2" placeholder="viewer1@example.com"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">&#128190; 設定を保存</button>
      </form>
    </div>
  </div>
</template>

<!-- ═══ モーダル：案件作成 ═══════════════════════════════════ -->
<template id="tpl-modal-create-deal">

      <div class="modal-title">&#10133; 新規案件作成</div>
      <form id="create-deal-form">
        <div class="form-group">
          <label class="form-label">案件名 *</label>
          <input type="text" class="form-control" id="new-deal-name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">クライアント</label>
            <input type="text" class="form-control" id="new-deal-client">

          <div class="form-group">

            <input type="text" class="form-control" id="new-deal-owner">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">状態</label>
            <select class="form-control" id="new-deal-status">
              <option value="企画中">企画中</option>
              <option value="提案中">提案中</option>
              <option value="進行中">進行中</option>

<!-- ═══ モーダル：人物追加（インフルエンサー等） ═══════════════════ -->
<template id="tpl-modal-add-person">
  <div class="modal-backdrop" id="modal-backdrop-add-person">
    <div class="modal">
      <div class="modal-title">&#10133; 新規人物登録</div>
      <form id="add-person-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">区分 *</label>
            <select class="form-control" id="new-person-category" required>
              <option value="">選択...</option>
              <option value="モデル">モデル</option>
              <option value="インフルエンサー">インフルエンサー</option>
              <option value="スポーツ選手・著名人">スポーツ選手・著名人</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">名前 *</label>
            <input type="text" class="form-control" id="new-person-name" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">ユーザー名</label>
            <input type="text" class="form-control" id="new-person-username" placeholder="@username">
          </div>
          <div class="form-group">
            <label class="form-label">フォロワー数</label>
            <input type="number" class="form-control" id="new-person-followers" min="0">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">URL</label>
          <input type="url" class="form-control" id="new-person-url" placeholder="https://...">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">サブカテゴリ</label>
            <input type="text" class="form-control" id="new-person-subcategory">
          </div>
          <div class="form-group">
            <label class="form-label">タグ</label>
            <input type="text" class="form-control" id="new-person-tags" placeholder="カンマ区切りなど">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">メモ</label>
          <textarea class="form-control" id="new-person-memo" rows="2"></textarea>
        </div>
        <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border-color, #e0e0e0);">
        <div class="form-group">
          <label class="form-label" style="display:flex; justify-content:space-between; align-items:center;">
            追加項目（任意）
            <button type="button" class="btn btn-sm btn-outline" id="btn-add-custom-field">＋項目を追加</button>
          </label>
          <div id="custom-fields-container"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel-add-person">キャンセル</button>
          <button type="submit" class="btn btn-primary">&#10133; 登録実行</button>
        </div>
      </form>
    </div>
  </div>
</template>

<!-- ═══ モーダル：一括AI補完 ═══════════════════════════════════ -->
<template id="tpl-modal-batch-enrich">
  <div class="modal-backdrop" id="modal-backdrop-batch-enrich">
    <div class="modal" style="width: 500px;">
      <div class="modal-title" style="color:#a855f7;">✨ 検索結果を一括AI自動補完</div>
      <p style="margin-bottom: 12px; font-size: 0.9em; line-height: 1.5; color: #555;">
        表示中の検索結果に対して、1件ずつWeb検索とAI抽出を自動で実行し、スプレッドシートに保存します。<br><br>
        <strong style="color:red;">【重要】API制限を避けるため、1件につき約5秒の待機時間を挟みます。</strong><br>
        途中でブラウザのタブを閉じると処理が中断されます。
      </p>
      
      <div id="batch-enrich-setup">
        <div class="form-group">
          <label class="form-label">今回処理する件数を指定してください（最大500推奨）</label>
          <input type="number" class="form-control" id="batch-enrich-count" value="50" min="1" max="1500" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel-batch-enrich">キャンセル</button>
          <button type="button" class="btn btn-primary" id="btn-start-batch-enrich" style="background-color:#a855f7; border-color:#a855f7;">処理開始</button>
        </div>
      </div>

      <div id="batch-enrich-progress" class="hidden">
        <div style="margin-bottom: 8px; font-weight: bold;" id="batch-enrich-status-text">処理の準備中...</div>
        <div style="width: 100%; background-color: #eee; border-radius: 4px; height: 16px; margin-bottom: 12px; overflow: hidden;">
          <div id="batch-enrich-progress-bar" style="width: 0%; height: 100%; background-color: #a855f7; transition: width 0.3s;"></div>
        </div>
        <div style="font-size: 0.85em; color: #666; margin-bottom: 16px; height: 60px; overflow-y: auto; background: #f9f9f9; padding: 4px; border: 1px solid #ddd;" id="batch-enrich-log">
          <!-- ログがここに入ります -->
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="btn-stop-batch-enrich">一時停止 / 中止</button>
          <button type="button" class="btn btn-secondary hidden" id="btn-close-batch-enrich">閉じる</button>
        </div>
      </div>
    </div>
  </div>
</template>
