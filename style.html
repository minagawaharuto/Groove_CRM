<style>
/* ============================================================
   style.html — デザインシステム
   タレント・インフルエンサー管理 CRM
   ============================================================ */

/* ─── CSS 変数 ──────────────────────────────────────────── */
:root {
  /* プライマリ（落ち着いた青系） */
  --primary-50:  #e8eef6;
  --primary-100: #c5d4ea;
  --primary-200: #9fb8dc;
  --primary-300: #789bce;
  --primary-400: #5b85c4;
  --primary-500: #3e6fba;
  --primary-600: #3762a8;
  --primary-700: #2d5291;
  --primary-800: #24437b;
  --primary-900: #162c57;

  /* ニュートラル */
  --gray-50:  #f8f9fa;
  --gray-100: #f1f3f5;
  --gray-200: #e9ecef;
  --gray-300: #dee2e6;
  --gray-400: #ced4da;
  --gray-500: #adb5bd;
  --gray-600: #868e96;
  --gray-700: #495057;
  --gray-800: #343a40;
  --gray-900: #212529;

  /* アクセント */
  --success: #2e7d32;
  --success-bg: #e8f5e9;
  --warning: #f57f17;
  --warning-bg: #fff8e1;
  --danger:  #c62828;
  --danger-bg: #ffebee;
  --info:    #1565c0;
  --info-bg: #e3f2fd;

  /* レイアウト */
  --navbar-h: 56px;
  --sidebar-w: 480px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.1);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.14);
  --transition: .2s ease;

  /* フォント */
  --font-sans: 'Segoe UI', 'Meiryo', 'Hiragino Sans', sans-serif;
  --font-mono: 'Consolas', 'Menlo', monospace;
}

/* ─── リセット ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-sans);
  color: var(--gray-800);
  background: var(--gray-100);
  line-height: 1.6;
  overflow: hidden;
  height: 100vh;
}
a { color: var(--primary-600); text-decoration: none; }
a:hover { color: var(--primary-800); text-decoration: underline; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }

/* ─── ナビゲーションバー ────────────────────────────────── */
.navbar {
  display: flex;
  align-items: center;
  height: var(--navbar-h);
  background: linear-gradient(135deg, var(--primary-800), var(--primary-600));
  color: #fff;
  padding: 0 20px;
  box-shadow: var(--shadow-md);
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
}
.navbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.2rem;
  font-weight: 700;
  margin-right: 32px;
}
.navbar-logo { font-size: 1.4rem; }
.navbar-links { display: flex; gap: 4px; flex: 1; }
.nav-link {
  color: rgba(255,255,255,.75);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-weight: 500;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .95rem;
}
.nav-link:hover {
  color: #fff;
  background: rgba(255,255,255,.12);
  text-decoration: none;
}
.nav-link.active {
  color: #fff;
  background: rgba(255,255,255,.2);
}
.nav-icon { font-size: 1rem; }
.navbar-user {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .85rem;
}
.user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: .9rem;
}

/* ─── メインコンテナ ────────────────────────────────────── */
.app-container {
  margin-top: var(--navbar-h);
  height: calc(100vh - var(--navbar-h));
  display: flex;
  overflow: hidden;
}

/* ─── ツーカラムレイアウト ───────────────────────────────── */
.two-column {
  display: flex;
  width: 100%;
  height: 100%;
}
.left-pane {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 20px;
  background: var(--gray-50);
  border-right: 1px solid var(--gray-200);
}
.right-pane {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  overflow-y: auto;
  padding: 20px;
  background: #fff;
  box-shadow: -2px 0 8px rgba(0,0,0,.04);
  transition: transform .3s ease;
}
.right-pane.hidden {
  transform: translateX(100%);
  width: 0;
  min-width: 0;
  padding: 0;
  overflow: hidden;
}

/* 単一ペイン（案件・管理画面用） */
.single-pane {
  width: 100%;
  overflow-y: auto;
  padding: 24px 32px;
  background: var(--gray-50);
}

/* ─── カード ────────────────────────────────────────────── */
.card {
  background: #fff;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--gray-200);
  padding: 20px;
  margin-bottom: 16px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--gray-200);
}
.card-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--gray-800);
}

/* ─── テーブル ──────────────────────────────────────────── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: .88rem;
}
.data-table thead th {
  background: var(--primary-50);
  color: var(--primary-800);
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--primary-200);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}
.data-table tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--gray-200);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.data-table tbody tr {
  transition: background var(--transition);
  cursor: pointer;
}
.data-table tbody tr:hover {
  background: var(--primary-50);
}
.data-table tbody tr.selected {
  background: var(--primary-100);
  box-shadow: inset 3px 0 0 var(--primary-500);
}

/* ─── フォーム ──────────────────────────────────────────── */
.form-group {
  margin-bottom: 14px;
}
.form-label {
  display: block;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--gray-700);
  font-size: .85rem;
}
.form-control {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--gray-300);
  border-radius: var(--radius-sm);
  font-size: .92rem;
  transition: border-color var(--transition), box-shadow var(--transition);
  background: #fff;
}
.form-control:focus {
  outline: none;
  border-color: var(--primary-400);
  box-shadow: 0 0 0 3px rgba(62,111,186,.15);
}
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}
.form-inline {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-wrap: wrap;
}
.form-inline .form-group { margin-bottom: 0; }

/* ─── ボタン ────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border: none;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: .88rem;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-primary {
  background: var(--primary-600);
  color: #fff;
}
.btn-primary:hover { background: var(--primary-700); }
.btn-secondary {
  background: var(--gray-200);
  color: var(--gray-700);
}
.btn-secondary:hover { background: var(--gray-300); }
.btn-success {
  background: var(--success);
  color: #fff;
}
.btn-success:hover { background: #1b5e20; }
.btn-danger {
  background: var(--danger);
  color: #fff;
}
.btn-danger:hover { background: #b71c1c; }
.btn-sm { padding: 5px 12px; font-size: .82rem; }
.btn-outline {
  background: #fff;
  color: var(--gray-700);
  border: 1px solid var(--gray-300);
}
.btn-outline:hover { background: var(--gray-100); border-color: var(--gray-400); }
.btn-outline.active {
  background: var(--primary-600);
  color: #fff;
  border-color: var(--primary-600);
}
.btn-lg { padding: 12px 28px; font-size: 1rem; }
.btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* ─── バッジ ────────────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 600;
}
.badge-primary { background: var(--primary-100); color: var(--primary-800); }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
.badge-info    { background: var(--info-bg);     color: var(--info); }

/* ─── ステータスバッジ ──────────────────────────────────── */
.status-badge {
  padding: 3px 10px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 600;
}

/* ─── ページング ────────────────────────────────────────── */
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--gray-200);
}
.pagination-info { color: var(--gray-600); font-size: .85rem; }
.pagination-buttons { display: flex; gap: 4px; }

/* ─── タイムライン ──────────────────────────────────────── */
.timeline {
  position: relative;
  padding-left: 24px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--gray-300);
}
.timeline-item {
  position: relative;
  margin-bottom: 16px;
  padding: 12px 16px;
  background: var(--gray-50);
  border-radius: var(--radius-md);
  border: 1px solid var(--gray-200);
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -20px;
  top: 16px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--primary-500);
  border: 2px solid #fff;
  box-shadow: var(--shadow-sm);
}
.timeline-date {
  font-size: .78rem;
  color: var(--gray-500);
  margin-bottom: 4px;
}
.timeline-type {
  font-weight: 600;
  color: var(--primary-700);
  margin-right: 8px;
}
.timeline-content {
  font-size: .88rem;
  line-height: 1.5;
  color: var(--gray-700);
}

/* ─── トースト ──────────────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
}
.toast {
  min-width: 300px;
  max-width: 440px;
  padding: 14px 20px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  font-size: .9rem;
  font-weight: 500;
  animation: toast-in .3s ease forwards;
  display: flex;
  align-items: center;
  gap: 10px;
}
.toast-success { background: var(--success); color: #fff; }
.toast-error   { background: var(--danger);  color: #fff; }
.toast-info    { background: var(--info);    color: #fff; }
.toast-warning { background: var(--warning); color: #fff; }
.toast-icon { font-size: 1.2rem; }
.toast-close {
  margin-left: auto;
  background: none;
  border: none;
  color: rgba(255,255,255,.8);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 0 4px;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(20px) scale(.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toast-out {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(20px); }
}

/* ─── スピナー ──────────────────────────────────────────── */
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--gray-300);
  border-top-color: var(--primary-500);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-fullpage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 100%;
  gap: 12px;
  color: var(--gray-500);
}
.loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  border-radius: var(--radius-md);
}
.loading-inline {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 20px;
  color: var(--gray-500);
  justify-content: center;
}

/* ─── 詳細ペイン セクション ─────────────────────────────── */
.detail-section {
  margin-bottom: 20px;
}
.detail-section-title {
  font-size: .92rem;
  font-weight: 700;
  color: var(--primary-700);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--primary-100);
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
}
.detail-item {
  display: flex;
  flex-direction: column;
}
.detail-label {
  font-size: .78rem;
  color: var(--gray-500);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .3px;
}
.detail-value {
  font-size: .92rem;
  color: var(--gray-800);
  word-break: break-all;
}

/* ─── 閉じるボタン ──────────────────────────────────────── */
.close-btn {
  background: none;
  border: none;
  font-size: 1.4rem;
  color: var(--gray-500);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: var(--transition);
}
.close-btn:hover { background: var(--gray-100); color: var(--gray-800); }

/* ─── 管理画面 ──────────────────────────────────────────── */
.admin-actions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.admin-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-md);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  text-align: center;
}
.admin-card h3 {
  font-size: 1rem;
  margin-bottom: 8px;
  color: var(--gray-800);
}
.admin-card p {
  font-size: .85rem;
  color: var(--gray-600);
  margin-bottom: 16px;
}

/* ─── モーダル ──────────────────────────────────────────── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fade-in .2s ease;
}
.modal {
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px;
  animation: scale-in .2s ease;
}
.modal-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--gray-200);
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--gray-200);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes scale-in { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ─── 空状態表示 ────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--gray-500);
}
.empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state-text { font-size: 1rem; }

/* ─── スクロールバー ────────────────────────────────────── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--gray-300);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

/* ─── ユーティリティ ────────────────────────────────────── */
.text-right { text-align: right; }
.text-center { text-align: center; }
.text-muted { color: var(--gray-500); }
.text-sm { font-size: .82rem; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-16 { margin-bottom: 16px; }
.gap-8 { gap: 8px; }
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.hidden { display: none !important; }

/* ─── レンジスライダー ──────────────────────────────────── */
.range-slider-wrap {
  margin-top: 6px;
  padding: 0 4px;
}
.range-slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2px;
}
.range-slider-label {
  font-size: .78rem;
  font-weight: 600;
  color: var(--gray-600);
}
.range-slider-values {
  font-size: .78rem;
  color: var(--primary-700);
  font-weight: 600;
}
.range-slider-container {
  position: relative;
  height: 28px;
}
.range-slider-track {
  position: absolute;
  top: 12px;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--gray-300);
  border-radius: 2px;
}
.range-slider-fill {
  position: absolute;
  top: 12px;
  height: 4px;
  background: linear-gradient(90deg, var(--primary-400), var(--primary-600));
  border-radius: 2px;
}
.range-slider-container input[type="range"] {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 28px;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  pointer-events: none;
  margin: 0;
}
.range-slider-container input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--primary-600);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
  pointer-events: auto;
  cursor: grab;
  transition: transform .15s ease, box-shadow .15s ease;
}
.range-slider-container input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
  box-shadow: 0 2px 8px rgba(62,111,186,.35);
}
.range-slider-container input[type="range"]::-webkit-slider-thumb:active {
  cursor: grabbing;
  transform: scale(1.15);
}
.range-slider-container input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--primary-600);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
  pointer-events: auto;
  cursor: grab;
}
</style>
